spring.application.name=slotera
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/slotera}
spring.datasource.username=${DATABASE_USER:slotera}
spring.datasource.password=${DATABASE_PASSWORD:slotera_local}
spring.jpa.hibernate.ddl-auto=validate
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.open-in-view=false
slotera.security.issuer=${OIDC_ISSUER:http://localhost:18088/realms/slotera}
slotera.security.audience=${OIDC_AUDIENCE:slotera-api}
slotera.security.web-origin=${WEB_ORIGIN:http://localhost:5173}
