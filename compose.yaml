services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: slotera
      POSTGRES_USER: slotera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotera_local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotera -d slotera"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
